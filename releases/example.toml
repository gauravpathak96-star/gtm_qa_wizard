# Example release file. Create your own with:  uv run gtm-qa new <release> --sites myprotein,lookfantastic
# Real release files stay on your computer (git-ignored): preview links give access to your workspace.

name = "example"

# Your name, for the report
tester = "Example tester"

# What this release changes, in a sentence (shown in the report)
note = "Example: consent template fix in every brand's container"

# Journeys to run on every brand: opt-in (Accept all) and opt-out (Reject all)
journeys = ["opt-in", "opt-out"]

[[brands]]
# Site recipe in sites/lookfantastic.json (how to click through the site)
site = "lookfantastic"
# GTM › Preview › Tag Assistant › ⋮ › Share, one link per container this release changes on this brand.
preview_links = ["https://tagassistant.google.com/#/?id=GTM-XXXXXXX&gtm_auth=EXAMPLE&gtm_preview=env-5"]
# Optional: GTM container exports, so renamed and re-created tags are paired.
exports_before = ""
exports_after = ""

[[brands]]
site = "myprotein"
preview_links = ["https://tagassistant.google.com/#/?id=GTM-YYYYYYY&gtm_auth=EXAMPLE&gtm_preview=env-9"]
exports_before = ""
exports_after = ""
